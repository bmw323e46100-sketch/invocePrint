[package]
name = "zayavka"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
authors = ["Trade Point App"]
description = "Автономное настольное приложение для формирования заявки на отгрузку в PDF"
build = "build.rs"

[lib]
name = "zayavka"
path = "src/lib.rs"

[[bin]]
name = "zayavka"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
genpdf = "0.2"
rand = "0.8"
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
open = "5"
rfd = "0.15"
ttf-parser = "0.25"
arboard = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
